<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#07111f">

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
>

<meta
    name="apple-mobile-web-app-title"
    content="Quy Nhon Travel"
>
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Phu Cat Airport</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/airport.css">
</head>

<body>

    <main class="airport-page">

        <section class="arrival-card">

            <div class="airport-icon">
                <i class="fa-solid fa-plane-arrival"></i>
            </div>

            <div class="arrival-content">

                <div class="eyebrow">
                    PHU CAT AIRPORT
                </div>

                <h1>
                    YOU HAVE ARRIVED<br>
                    AT PHU CAT AIRPORT.
                </h1>

                <p class="question">
                    How would you like to reach Quy Nhon?
                </p>

                <div class="transport-options">

                    <button
                        class="transport-option"
                        type="button"
                        data-option="taxi"
                    >
                        <span class="transport-icon">🚕</span>

                        <span class="transport-text">
                            <strong>Taxi</strong>
                        </span>

                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                    <button
                        class="transport-option"
                        type="button"
                        data-option="shuttle"
                    >
                        <span class="transport-icon">🚌</span>

                        <span class="transport-text">
                            <strong>Shuttle</strong>
                        </span>

                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                    <button
                        class="transport-option"
                        type="button"
                        data-option="private"
                    >
                        <span class="transport-icon">🚗</span>

                        <span class="transport-text">
                            <strong>Private transfer</strong>
                        </span>

                        <i class="fa-solid fa-chevron-right"></i>
                    </button>

                </div>

            </div>

        </section>

    </main>

    <script src="js/airport.js"></script>

</body>
</html>
