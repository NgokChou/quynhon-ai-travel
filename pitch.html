<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06111f">
    <title>Quy Nhon AI Pitch</title>
    <link rel="stylesheet" href="css/pitch.css">
</head>
<body>
    <main class="pitch-screen" aria-label="AI travel pitch">
        <section class="pitch-stage" aria-live="polite">
            <button id="ai-pitch-orb" class="pitch-orb" type="button" aria-label="Start AI pitch">
                <span class="orb-core"></span>
                <span class="orb-glow"></span>
                <span class="orb-ring orb-ring-one"></span>
                <span class="orb-ring orb-ring-two"></span>
                <span class="orb-wave" aria-hidden="true"></span>
            </button>
            <p id="pitch-status" class="pitch-status" aria-live="polite"></p>
        </section>

        <div class="pitch-controls" aria-label="Pitch controls">
            <div class="language-switch" role="group" aria-label="Language">
                <button type="button" class="language-button is-active" data-language="en">EN</button>
                <button type="button" class="language-button" data-language="vi">VI</button>
            </div>
            <button id="pitch-stop" class="stop-button" type="button" aria-label="Stop pitch">Stop</button>
        </div>
    </main>

    <script src="js/elevenlabsConfig.js"></script>
    <script src="js/pitchScript.js"></script>
    <script src="js/pitch.js"></script>
</body>
</html>
